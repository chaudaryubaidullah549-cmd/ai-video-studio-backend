services:
  - type: web
    name: ai-video-studio-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MOCK_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/data/app.db
      - key: LOCAL_STORAGE_PATH
        value: /opt/render/project/src/storage
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: HF_TOKEN
        sync: false
      - key: HF_VIDEO_MODEL
        value: Lightricks/LTX-Video-0.9.8-13B-distilled
      - key: HF_PROVIDER
        value: auto
      - key: HF_LLM_MODEL
        value: meta-llama/Llama-3.3-70B-Instruct
